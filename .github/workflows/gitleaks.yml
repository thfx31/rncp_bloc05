name: gitleaks

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

        continue-on-error: true
